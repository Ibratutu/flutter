name: modern_quran_app
description: A comprehensive, modern Islamic app featuring Quran reading, audio recitations, Islamic literature, and community features.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^12.1.3
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  get_it: ^7.6.4
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Network & API
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^5.0.2
  dartz: ^0.10.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # Audio & Video
  just_audio: ^0.9.36
  video_player: ^2.8.1
  audio_video_progress_bar: ^2.0.1
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8
  firebase_messaging: ^14.7.10
  
  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^5.0.0
  
  # Location & Prayers
  geolocator: ^10.1.0
  adhan: ^2.0.0+1
  timezone: ^0.9.2
  
  # File Handling
  path_provider: ^2.1.2
  file_picker: ^6.1.1
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  flutter_launcher_icons: ^0.13.1
  permission_handler: ^11.1.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  
  # Islamic Features
  hijri: ^3.0.0
  
  # UI Enhancements
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  card_swiper: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  bloc_test: ^9.1.5
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/
    - assets/data/
    - assets/fonts/
  
  # fonts:
    # - family: Amiri
    #   fonts:
    #     - asset: assets/fonts/Amiri-Regular.ttf
    #     - asset: assets/fonts/Amiri-Bold.ttf
    #       weight: 700
    # - family: NotoSansArabic
    #   fonts:
    #     - asset: assets/fonts/NotoSansArabic-Regular.ttf
    #     - asset: assets/fonts/NotoSansArabic-Bold.ttf
    #       weight: 700
    # - family: Scheherazade
    #   fonts:
    #     - asset: assets/fonts/Scheherazade-Regular.ttf
    #     - asset: assets/fonts/Scheherazade-Bold.ttf
    #       weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21